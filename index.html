<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lunex — Lua playground</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand"><strong>Lunex</strong><span>Lua 5.2 · bytecode VM</span></div>
        <nav class="nav">
          <a href="./index.html" class="active">Playground</a>
          <a href="./vm.html">8-bit CPU</a>
          <a href="https://github.com/definitelynotguru/Lunex" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
        <div class="toolbar">
          <select id="demoSelect" aria-label="Demo"></select>
          <button type="button" id="btnRun" class="primary" title="Ctrl/Cmd+Enter">Run</button>
          <button type="button" id="btnStep">Step</button>
          <button type="button" id="btnContinue" disabled>Continue</button>
          <button type="button" id="btnClear">Clear</button>
          <button type="button" id="btnShare">Share</button>
        </div>
      </header>
      <main class="workspace">
        <section class="panel">
          <div class="panel-head">Source <span class="hint" style="margin-left:auto;text-transform:none;letter-spacing:0">Ctrl/Cmd+Enter to run</span></div>
          <div class="editor-host" id="editor"></div>
        </section>
        <div class="right-stack">
          <section class="panel">
            <div class="panel-head">
              Console
              <div class="tabs">
                <button type="button" class="active" data-pane="output">Output</button>
              </div>
            </div>
            <div class="console" id="console"></div>
          </section>
          <section class="panel">
            <div class="panel-head">
              Inspector
              <div class="tabs" id="inspectTabs">
                <button type="button" class="active" data-insp="ast">AST</button>
                <button type="button" data-insp="bc">Bytecode</button>
                <button type="button" data-insp="locals">Locals</button>
              </div>
            </div>
            <div class="inspector" id="inspector"></div>
          </section>
        </div>
      </main>
      <footer class="status">
        <span id="statusLeft">Ready</span>
        <span id="statusRight">register VM · educational</span>
      </footer>
    </div>
    <script type="module" src="/src/playground/main.ts"></script>
  </body>
</html>
