<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lunex VM — 8-bit CPU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/src/styles/theme.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand"><strong>Lunex VM</strong><span>8-bit CPU · 33 ops</span></div>
        <nav class="nav">
          <a href="./index.html">Playground</a>
          <a href="./vm.html" class="active">8-bit CPU</a>
          <a href="https://github.com/definitelynotguru/Lunex" target="_blank" rel="noreferrer">GitHub</a>
        </nav>
        <div class="toolbar">
          <select id="demoSelect" aria-label="Demo"></select>
          <select id="speed" aria-label="Speed">
            <option value="1">1 Hz</option>
            <option value="10" selected>10 Hz</option>
            <option value="100">100 Hz</option>
            <option value="1000">1000 Hz</option>
          </select>
          <button type="button" id="btnAssemble" class="primary">Assemble</button>
          <button type="button" id="btnRun">Run</button>
          <button type="button" id="btnStep">Step</button>
          <button type="button" id="btnReset">Reset</button>
        </div>
      </header>
      <main class="vm-grid">
        <section class="panel">
          <div class="panel-head">Assembly <span class="hint" style="margin-left:auto;text-transform:none;letter-spacing:0">Ctrl/Cmd+Enter assemble · Ctrl/Cmd+. step</span></div>
          <div class="editor-host" id="editor"></div>
        </section>
        <aside class="vm-side">
          <div class="panel-head">Registers</div>
          <div class="reg-grid" id="regs"></div>
          <div class="flags" id="flags"></div>
          <div class="panel-head">Memory <span class="hint" style="margin-left:auto;text-transform:none;letter-spacing:0">click byte = breakpoint</span></div>
          <div class="mem" id="mem"></div>
          <div class="panel-head">Output</div>
          <div id="output"></div>
        </aside>
      </main>
      <footer class="status">
        <span id="statusLeft">Ready</span>
        <span>bottom-up companion to the Lua VM</span>
      </footer>
    </div>
    <script type="module" src="/src/vm/main.ts"></script>
  </body>
</html>
